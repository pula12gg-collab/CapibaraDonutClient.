name: Build Fabric mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          if [ ! -f settings.gradle ]; then
            mkdir -p extracted-project
            unzip -o CapibaraDonutClient-1.21.11-source.zip -d extracted-project
          fi

      - name: Build mod
        run: |
          BUILD_FILE=$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Nu am găsit build.gradle"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          gradle build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: capibara-donut-client
          path: '**/build/libs/*.jar'
